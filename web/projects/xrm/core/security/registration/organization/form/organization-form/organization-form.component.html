<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="org">
  <ng-template xrmTab="general">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta">
          <h2 class="xf-section-title">Details</h2>
        </div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of sortedFields(); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
  </ng-template>
  <ng-template xrmTab="teams">
    @if (id(); as orgId) {
      <xrm-related-grid entityName="team"
        [filters]="[{ field: 'organization_ref', value: orgId }]" [pageSize]="10" />
    } @else {
      <p class="xf-hint">Save the record before viewing teams.</p>
    }
  </ng-template>
  <ng-template xrmTab="users">
    @if (id(); as orgId) {
      <xrm-related-grid entityName="user_account"
        [filters]="[{ field: 'organization_ref', value: orgId }]" [pageSize]="10" />
    } @else {
      <p class="xf-hint">Save the record before viewing users.</p>
    }
  </ng-template>
</xrm-base-form>
