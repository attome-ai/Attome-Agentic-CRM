<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="docgen-template">
  <ng-template xrmTab="details">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">Details</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['name', 'entity', 'format', 'body', 'stylesheet', 'page_size', 'margin_mm', 'attach_to_field', 'version']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
        @defer (on viewport) {
          <attome-template-preview
            [template]="draft().body"
            [entity]="draft().entity"
            [recordId]="id()" />
        } @placeholder {
          <div></div>
        }
      </div>
    </section>
  </ng-template>
</xrm-base-form>
