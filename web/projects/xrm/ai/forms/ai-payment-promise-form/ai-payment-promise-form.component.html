<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="ai-payment-promise">
  <ng-template xrmTab="details">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">Details</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['invoice_entity', 'invoice_id', 'invoice_number', 'customer_entity', 'customer_id', 'promised_amount', 'promised_date', 'source', 'status', 'note']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
  </ng-template>
</xrm-base-form>
