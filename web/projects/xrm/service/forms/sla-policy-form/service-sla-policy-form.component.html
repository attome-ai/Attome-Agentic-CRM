<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="service-sla-policy">
  <ng-template xrmTab="details">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">Details</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['name', 'priority', 'resolution_target_minutes', 'business_hours_start_minute', 'business_hours_end_minute', 'calendar_ref', 'is_active', 'warn_at_percent', 'severity']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
  </ng-template>
</xrm-base-form>
