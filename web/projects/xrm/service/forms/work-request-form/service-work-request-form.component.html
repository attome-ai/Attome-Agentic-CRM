<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="service-work-request">
  <ng-template xrmTab="details">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">Details</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['title', 'description', 'request_type', 'requester_id', 'status', 'resolved_entity_name', 'resolved_record_id', 'channel', 'offering_id', 'priority', 'queue_ref', 'sla_policy_id', 'portal_public_id', 'portal_secret_hash', 'work_queue_ref']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
  </ng-template>
</xrm-base-form>
