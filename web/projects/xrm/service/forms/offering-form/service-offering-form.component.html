<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="service-offering">
  <ng-template xrmTab="details">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">Details</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['name', 'category', 'description', 'intake_form_ref', 'default_queue_ref', 'default_sla_policy_id', 'default_priority', 'approval_policy_ref', 'fulfilment', 'is_public', 'is_active']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
  </ng-template>
</xrm-base-form>
