<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="account">
  <ng-template xrmTab="details">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">{{ 'xrmForm.tabs.details' | translate }}</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['annual_revenue', 'email_domain', 'industry', 'name', 'parent_account_ref', 'phone', 'website']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
    @if (id(); as recordId) {
      <!-- G15-T1 — the customer's open work, timeline and AI summary. -->
      <xrm-customer-360 entity="account" [recordId]="recordId" />
    }
  </ng-template>
</xrm-base-form>
