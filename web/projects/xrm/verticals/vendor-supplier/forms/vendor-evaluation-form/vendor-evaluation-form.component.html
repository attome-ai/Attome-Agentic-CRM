<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="vendor-evaluation">
  <ng-template xrmTab="general">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">{{ 'xrmForm.tabs.details' | translate }}</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['vendor_ref', 'period', 'on_time_delivery_pct', 'quality_score']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">Notes</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['notes']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
  </ng-template>
</xrm-base-form>
