<xrm-base-form [form]="this" [formGroup]="form()" idPrefix="audit-legal-matter">
  <ng-template xrmTab="details">
    <section class="xf-section">
      <div class="xf-section-header">
        <div class="xf-section-icon"><i class="las la-list-alt"></i></div>
        <div class="xf-section-meta"><h2 class="xf-section-title">Details</h2></div>
      </div>
      <div class="xf-section-body">
        <div class="xf-grid-2">
          @for (field of fieldsIn(['reference', 'custodian', 'scope_entity', 'scope_filter', 'status', 'collected_record_count', 'package_ref', 'package_checksum', 'opened_at', 'collected_at', 'released_at']); track field.id) {
            <attome-field-input [field]="field" [entityName]="name()" [recordId]="id()" />
          }
        </div>
      </div>
    </section>
  </ng-template>
</xrm-base-form>
