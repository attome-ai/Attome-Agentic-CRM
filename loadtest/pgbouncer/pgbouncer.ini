; P1.8d step 5 / P1.12 exercise — pgbouncer fronting the *loadtest* Postgres
; instance only (postgres-loadtest, port 5556 on the host / 5432 in-network).
; This is NOT the P1.12 reference recipe at ../../pgbouncer/pgbouncer.ini
; (which fronts a primary+replica pair for a real deployment) — this is a
; single-upstream pooler whose only job is answering the P1.12 exercise
; question ("does fronting N=20+ app nodes with a transaction pooler keep
; Postgres connection count down and P99 latency roughly flat, compared to
; every node connecting directly?"). No replica involved here; replica
; routing is already covered by the real recipe and out of scope for this
; harness (loadtest/README.md's known-deviations section documents this).
;
; Runs on `edoburu/pgbouncer` (pgbouncer >= 1.21, see ../Dockerfile), not
; bookworm's apt package (1.18) the real recipe still uses — 1.18 lacks
; protocol-level prepared-statement support under transaction pooling, which
; this exercise hit directly ("prepared statement already exists"/"does not
; exist" under real load) before switching images. See DECISIONS.md for the
; full story, including two workarounds tried and abandoned
; (database.disable_statement_cache, server_reset_query_always) once the
; real fix (a current pgbouncer) was in place.
;
; auth_type = md5 (not trust): pgbouncer's `trust` auth type still requires
; the client-supplied user to be a KNOWN user (registered via auth_file),
; not "any user, no check" the way the name suggests — found by actually
; connecting through this pooler. This pooler is still only ever reachable
; from inside the isolated loadtest Docker network
; (loadtest/docker-compose.loadtest.yml has no external ports beyond the
; already-throwaway 5556/6380), guarded the same way the rest of this
; harness is (LOADTEST_ACK + "loadtest" substring check in common.ps1) — the
; throwaway password below is already in plaintext elsewhere in this
; harness's tracked source (common.ps1), so its md5 hash sitting here is
; not a new exposure.
;
; No per-database `options=` here (tried, then reverted): pgbouncer's own
; [databases] line parser rejects it outright ("unrecognized connection
; parameter: options", FATAL, config load fails, container never starts —
; found by actually trying it; this is not a version-specific limitation).
; search_path is instead set at the Postgres role level via `ALTER ROLE
; postgres IN DATABASE attome_loadtest SET search_path = attome_loadtest`
; (run once by run-p112-exercise.ps1 before bringing this overlay up) --
; that applies regardless of how the connection reaches Postgres (direct or
; through any pooler), sidestepping pgbouncer's database-line limitations
; entirely.
;
; user=/password= here (found necessary): auth_type/auth_file above only
; govern how CLIENTS authenticate TO pgbouncer -- they don't give pgbouncer
; anything to authenticate itself WITH against the real upstream Postgres,
; whose own pg_hba.conf (postgres:18's image default) still requires a real
; password for a network connection from a different container. Without
; this, pgbouncer's own connection to postgres-loadtest fails ("password
; authentication failed") before any app request is ever served.
[databases]
attome_loadtest_pooled = host=postgres-loadtest port=5432 dbname=attome_loadtest user=postgres password=loadtest-throwaway-pw

[pgbouncer]
listen_addr = *
listen_port = 6432
unix_socket_dir =

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Found by actually running this exercise: sqlx's Postgres client sends
; extra_float_digits as a connection startup parameter, which pgbouncer
; rejects by default ("unsupported startup parameter", FATAL 08P01) unless
; explicitly told to pass it through. application_name is included too since
; it's the other startup parameter sqlx commonly sends and the same failure
; mode applies. options is listed too (the app's own connection string sends
; `?options=-c search_path=...` per client, which pgbouncer must not be
; asked to honor per-client under pooling -- the [databases] line above is
; what actually sets it, once, per real backend connection). The real
; recipe (../../pgbouncer/pgbouncer.ini) had the identical extra_float_digits/
; application_name gap -- see that file and DECISIONS.md for the shared fix.
ignore_startup_parameters = extra_float_digits, application_name, options

; Transaction mode is the whole point of this exercise (D-025 / P1.12) —
; matches the real recipe's reasoning: every advisory lock this platform
; takes is pg_try_advisory_xact_lock (transaction-scoped), so handing
; connections back to the pool at COMMIT/ROLLBACK is safe here. sqlx::migrate!'s
; own session-scoped advisory lock is why migrations always use
; database.direct_url and bypass this pooler entirely (see common.ps1's
; New-LoadtestConfig -Topology pgbouncer).
pool_mode = transaction

; pgbouncer >= 1.21 (this image is 1.25.2): protocol-level prepared
; statements, so sqlx's client-side statement cache works correctly under
; transaction pooling without needing database.disable_statement_cache or
; server_reset_query_always — both were tried against bookworm's 1.18
; package before switching images and neither fully closed the gap (see
; DECISIONS.md); this is the real fix, not a third workaround stacked on.
max_prepared_statements = 200

; Starting point for the exercise — this is exactly the number step 5 is
; supposed to produce evidence about (does a pool this size hold up under
; N=20+ app nodes without blowing Postgres max_connections).
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5

max_client_conn = 1000

logfile = /dev/stdout
