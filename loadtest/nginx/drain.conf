# AB7-T10: the load balancer of the rolling drain exercise
# (scripts/run-drain-exercise.ps1 -Mode rolling). Two nodes on the host, each
# under its own `attome supervise`; a node that is stopped refuses new
# connections, and nginx passes the request to the other node. Only a
# refused or failed connection moves a request on: a request a node has
# already received is answered by that node, which drains before it exits.
# No upstream keepalive: an idle pooled connection a draining node closes
# could take a request with it.

upstream attome_nodes {
    server host.docker.internal:7900 max_fails=1 fail_timeout=3s;
    server host.docker.internal:7910 max_fails=1 fail_timeout=3s;
}

server {
    listen 80;
    client_max_body_size 16m;

    location / {
        proxy_pass http://attome_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
    }
}
