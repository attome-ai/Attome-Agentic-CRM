apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "attome.name" . }}-worker
  labels:
    {{- include "attome.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "attome.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "attome.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "attome.pod" (dict "root" . "component" "worker" "command" "worker" "extra" (dict "resources" .Values.worker.resources)) | nindent 6 }}
