[workspace]
resolver = "3"
members = [
    "crates/foundation/attome-types",
    "crates/foundation/attome-config",
    "crates/sdk/attome-sdk",
    "crates/apps/attome",
]

# Layers (docs/architecture.md): foundation -> engine -> sdk -> packs -> apps, never back.
# A crate lives in the folder of its layer and is named `attome-<name>`.

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
authors      = ["Automatica Tech Solutions"]
license      = "AGPL-3.0-only"
repository   = "https://github.com/attome-ai/Attome-Agentic-CRM"
homepage     = "https://attome.com"
publish      = false

[workspace.dependencies]
# Internal crates
attome-types  = { path = "crates/foundation/attome-types" }
attome-config = { path = "crates/foundation/attome-config" }
attome-sdk   = { path = "crates/sdk/attome-sdk" }

# External crates
axum          = { version = "0.8", features = ["macros"] }
chrono        = { version = "0.4", features = ["serde"] }
dotenvy       = "0.15"
opentelemetry = "0.32"
serde         = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json    = "1"
thiserror     = "2"
tokio         = { version = "1", features = ["full"] }
tracing       = "0.1"
url           = "2"
utoipa        = { version = "5", features = ["macros", "uuid", "chrono"] }
uuid          = { version = "1", features = ["v4", "v5", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code       = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used  = "deny"
expect_used  = "warn"
dbg_macro    = "deny"
todo         = "deny"
print_stdout = "warn"

[profile.release]
lto           = "thin"
codegen-units = 1
