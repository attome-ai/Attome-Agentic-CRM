# Layers (docs/architecture.md): foundation -> engine -> sdk -> packs -> apps, never back.
# A crate lives in the folder of its layer and is named `attome-<name>`.

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
authors      = ["Automatica Tech Solutions"]
license      = "AGPL-3.0-only"
repository   = "https://github.com/attome-ai/Attome-Agentic-CRM"
homepage     = "https://attome.com"
publish      = false

[workspace.dependencies]
# AA14-T1: micro-benchmarks (dev-dependency only; no plotting backend).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Internal crates
attome-types   = { path = "crates/foundation/attome-types" }
attome-config  = { path = "crates/foundation/attome-config" }
attome-testkit = { path = "crates/foundation/attome-testkit" }
attome-db      = { path = "crates/foundation/attome-db" }
attome-outbound = { path = "crates/foundation/attome-outbound" }
attome-cache     = { path = "crates/foundation/attome-cache" }
attome-html      = { path = "crates/foundation/attome-html" }
attome-calendar  = { path = "crates/foundation/attome-calendar" }
attome-rules     = { path = "crates/foundation/attome-rules" }
attome-storage   = { path = "crates/foundation/attome-storage" }
attome-inference = { path = "crates/foundation/attome-inference" }
attome-profiler  = { path = "crates/foundation/attome-profiler" }
attome-email     = { path = "crates/foundation/attome-email" }
attome-jobs      = { path = "crates/foundation/attome-jobs" }
attome-auth      = { path = "crates/foundation/attome-auth" }
attome-server    = { path = "crates/foundation/attome-server" }
attome-approval  = { path = "crates/foundation/attome-approval" }
attome-modules   = { path = "crates/engine/attome-modules" }
attome-core      = { path = "crates/engine/attome-core" }
attome-metadata  = { path = "crates/engine/attome-metadata" }
attome-field     = { path = "crates/engine/attome-field" }
attome-model     = { path = "crates/engine/attome-model" }
attome-testapp   = { path = "crates/engine/attome-testapp" }
attome-audit     = { path = "crates/engine/attome-audit" }
attome-security  = { path = "crates/engine/attome-security" }
attome-records   = { path = "crates/engine/attome-records" }
attome-ai        = { path = "crates/engine/attome-ai" }
attome-s2s       = { path = "crates/engine/attome-s2s" }
attome-events    = { path = "crates/engine/attome-events" }
attome-integration = { path = "crates/engine/attome-integration" }
attome-notification = { path = "crates/engine/attome-notification" }
attome-workflow  = { path = "crates/engine/attome-workflow" }
attome-project   = { path = "crates/engine/attome-project" }
attome-service   = { path = "crates/engine/attome-service" }
attome-metric    = { path = "crates/engine/attome-metric" }
attome-sales     = { path = "crates/engine/attome-sales" }
attome-callintel = { path = "crates/engine/attome-callintel" }
attome-marketing = { path = "crates/engine/attome-marketing" }
attome-billing   = { path = "crates/engine/attome-billing" }
