# External crates
aes-gcm       = { version = "0.10", features = ["aes"] }
ammonia       = "~4.2"
apalis        = { version = "0.7.4", default-features = false, features = ["limit", "tracing"] }
apalis-sql    = { version = "0.7.4", default-features = false, features = ["postgres"] }
arc-swap      = "1"
argon2        = "0.6"
async-trait   = "0.1"
axum          = { version = "0.8", features = ["macros", "http2"] }
axum-prometheus = "0.10.1"
base64        = "0.23"
bytes         = "1"
chrono        = { version = "0.4", features = ["serde"] }
chrono-tz     = "0.10"
dotenvy       = "0.15"
ed25519-dalek = { version = "3", features = ["serde"] }
fred          = { version = "9", features = ["subscriber-client", "enable-rustls", "i-scripts", "i-streams", "sentinel-auth"] }
flate2        = "1"
# A23-T2: import files saved by Arabic Excel (Windows-1256, UTF-16).
encoding_rs   = "0.8"
futures-util  = "0.3"
# J2-T1: the IMAP mailbox reader (pure Rust; TLS through rustls with ring).
async-imap    = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
mail-parser   = "0.9"
tokio-rustls  = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots  = "0.26"
hex           = "0.4"
hmac          = "0.12"
http          = "1"
# Z6-T6: upload thumbnails; pure Rust, three decoders only.
image         = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
infer         = "0.22"
jsonwebtoken  = "9"
lettre        = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
metrics       = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
moka          = { version = "0.12", features = ["future"] }
object_store  = { version = "0.14", features = ["aws", "azure", "gcp"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = "0.32"
proptest      = "1"
rand          = "0.8"
regex         = "1"
reqwest       = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
ring          = "0.17"
rsa           = "0.9"
k256          = { version = "0.13", features = ["pem"] }
qrcode        = { version = "0.14", default-features = false, features = ["svg"] }
quick-xml     = "0.41"
rust_decimal  = { version = "1.36", features = ["serde-with-str"] }
rust_xlsxwriter = "0.100"
rustls        = { version = "0.23", default-features = false, features = ["std", "ring"] }
scraper       = "0.27"
serde         = { version = "1", features = ["derive"] }
# Z1-T4: the configuration's JSON Schema, derived from the typed sections.
schemars      = { version = "1", default-features = false, features = ["derive", "std", "uuid1"] }
serde_ignored = "0.1"
serde_json    = "1"
sha1          = "0.10"
rmp-serde     = "1"
sha2          = "0.10"
smartcore     = { version = "0.6", default-features = false }
sqlx          = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "tls-rustls", "json"] }
thiserror     = "2"
zeroize       = "1"
tokio         = { version = "1", features = ["full"] }
totp-rs       = { version = "6", default-features = false, features = ["gen_secret", "otpauth", "std"] }
tower         = { version = "0.5", features = ["full"] }
tower-http    = { version = "0.7", features = ["catch-panic", "cors", "trace", "compression-gzip", "compression-br", "timeout", "limit", "request-id"] }
tracing       = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url           = "2"
utoipa        = { version = "5", features = ["macros", "uuid", "chrono"] }
uuid          = { version = "1", features = ["v4", "v5", "v7", "serde"] }
# Windows only: run `attome serve` as a Windows service (roadmap U1-T1).
windows-service = "0.8.1"
windows-sys     = "0.61"

[workspace.lints.rust]
unsafe_code       = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used  = "deny"
expect_used  = "warn"
dbg_macro    = "deny"
todo         = "deny"
print_stdout = "warn"

[profile.dev]
# Line tables keep backtraces readable; full debug info made every test binary slow to link.
debug = "line-tables-only"

[profile.release]
lto           = "thin"
codegen-units = 1
