[workspace]
resolver = "3"
members = [
    "crates/foundation/attome-types",
    "crates/foundation/attome-config",
    "crates/foundation/attome-testkit",
    "crates/foundation/attome-db",
    "crates/foundation/attome-cache",
    "crates/foundation/attome-html",
    "crates/foundation/attome-calendar",
    "crates/foundation/attome-rules",
    "crates/foundation/attome-storage",
    "crates/foundation/attome-inference",
    "crates/foundation/attome-profiler",
    "crates/foundation/attome-email",
    "crates/foundation/attome-jobs",
    "crates/foundation/attome-auth",
    "crates/foundation/attome-server",
    "crates/foundation/attome-approval",
    "crates/engine/attome-modules",
    "crates/sdk/attome-sdk",
    "crates/apps/attome",
]

# Layers (docs/architecture.md): foundation -> engine -> sdk -> packs -> apps, never back.
# A crate lives in the folder of its layer and is named `attome-<name>`.

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
authors      = ["Automatica Tech Solutions"]
license      = "AGPL-3.0-only"
repository   = "https://github.com/attome-ai/Attome-Agentic-CRM"
homepage     = "https://attome.com"
publish      = false

[workspace.dependencies]
# Internal crates
attome-types   = { path = "crates/foundation/attome-types" }
attome-config  = { path = "crates/foundation/attome-config" }
attome-testkit = { path = "crates/foundation/attome-testkit" }
attome-db      = { path = "crates/foundation/attome-db" }
attome-cache     = { path = "crates/foundation/attome-cache" }
attome-html      = { path = "crates/foundation/attome-html" }
attome-calendar  = { path = "crates/foundation/attome-calendar" }
attome-rules     = { path = "crates/foundation/attome-rules" }
attome-storage   = { path = "crates/foundation/attome-storage" }
attome-inference = { path = "crates/foundation/attome-inference" }
attome-profiler  = { path = "crates/foundation/attome-profiler" }
attome-email     = { path = "crates/foundation/attome-email" }
attome-jobs      = { path = "crates/foundation/attome-jobs" }
attome-auth      = { path = "crates/foundation/attome-auth" }
attome-server    = { path = "crates/foundation/attome-server" }
attome-approval  = { path = "crates/foundation/attome-approval" }
attome-modules   = { path = "crates/engine/attome-modules" }
attome-sdk       = { path = "crates/sdk/attome-sdk" }

# External crates
aes-gcm       = { version = "0.10", features = ["aes"] }
ammonia       = "~4.1"
apalis        = { version = "0.7.4", default-features = false, features = ["limit", "tracing"] }
apalis-sql    = { version = "0.7.4", default-features = false, features = ["postgres"] }
arc-swap      = "1"
argon2        = "0.6"
axum          = { version = "0.8", features = ["macros"] }
axum-prometheus = "0.10.1"
base64        = "0.23"
bytes         = "1"
chrono        = { version = "0.4", features = ["serde"] }
chrono-tz     = "0.10"
dotenvy       = "0.15"
fred          = { version = "9", features = ["subscriber-client", "enable-rustls", "i-scripts", "i-streams", "sentinel-auth"] }
futures-util  = "0.3"
hex           = "0.4"
hmac          = "0.12"
http          = "1"
jsonwebtoken  = "9"
lettre        = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
metrics       = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
moka          = { version = "0.12", features = ["future"] }
object_store  = { version = "0.14", features = ["aws"] }
opentelemetry = "0.32"
proptest      = "1"
rand          = "0.8"
reqwest       = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
rsa           = "0.9"
rustls        = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde         = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json    = "1"
sha2          = "0.10"
sqlx          = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "tls-rustls", "json"] }
thiserror     = "2"
tokio         = { version = "1", features = ["full"] }
totp-rs       = { version = "6", default-features = false, features = ["gen_secret", "otpauth", "std"] }
tower         = { version = "0.5", features = ["full"] }
tower-http    = { version = "0.7", features = ["catch-panic", "cors", "trace", "compression-gzip", "compression-br", "timeout", "limit", "request-id"] }
tracing       = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url           = "2"
utoipa        = { version = "5", features = ["macros", "uuid", "chrono"] }
uuid          = { version = "1", features = ["v4", "v5", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code       = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used  = "deny"
expect_used  = "warn"
dbg_macro    = "deny"
todo         = "deny"
print_stdout = "warn"

[profile.release]
lto           = "thin"
codegen-units = 1
