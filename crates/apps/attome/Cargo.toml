[package]
name         = "attome"
description  = "Attome: the server (attome serve), its worker and tools, and the command-line tool that installs, runs and releases it."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish.workspace      = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "attome"
path = "src/main.rs"

[dependencies]
apalis.workspace                = true
arc-swap.workspace              = true
attome-ai.workspace             = true
attome-api.workspace            = true
attome-audit.workspace          = true
attome-auth.workspace           = true
attome-cache.workspace          = true
attome-compliance.workspace     = true
attome-config.workspace         = true
attome-content.workspace        = true
attome-core.workspace           = true
attome-dashboard.workspace      = true
attome-db.workspace             = true
attome-docgen.workspace         = true
attome-document.workspace       = true
attome-email.workspace          = true
attome-events.workspace         = true
attome-fleet                    = { workspace = true, optional = true }
attome-grc.workspace            = true
attome-integration.workspace    = true
attome-jobs.workspace           = true
attome-metadata.workspace       = true
attome-metric.workspace         = true
attome-sales.workspace          = true
attome-callintel.workspace = true
attome-marketing.workspace = true
attome-billing.workspace = true
attome-einvoice.workspace = true
attome-commission.workspace = true
attome-partner.workspace = true
attome-fulfilment.workspace = true
attome-workforce.workspace = true
attome-contract.workspace = true
attome-offline.workspace = true
attome-procurement.workspace = true
attome-hr.workspace = true
attome-chat.workspace = true
attome-model.workspace          = true
attome-modules.workspace        = true
attome-notification.workspace   = true
attome-portal.workspace         = true
attome-predict.workspace        = true
attome-process.workspace        = true
attome-profiler.workspace       = true
attome-project.workspace        = true
attome-records.workspace        = true
attome-release.workspace        = true
attome-report.workspace         = true
attome-s2s.workspace            = true
attome-search.workspace         = true
attome-security.workspace       = true
attome-server.workspace         = true
attome-service.workspace        = true
attome-state.workspace          = true
attome-storage.workspace        = true
attome-types.workspace          = true
attome-webcrawl.workspace       = true
attome-workflow.workspace       = true
axum.workspace                  = true
chrono.workspace                = true
fred.workspace                  = true
futures-util.workspace          = true
hex.workspace                   = true
opentelemetry.workspace         = true
opentelemetry-otlp.workspace    = true
opentelemetry_sdk.workspace     = true
rand.workspace                  = true
reqwest                         = { workspace = true, features = ["cookies"] }
rustls.workspace                = true
serde.workspace                 = true
serde_json.workspace            = true
sha2.workspace                  = true
sqlx.workspace                  = true
tokio.workspace                 = true
tower-http.workspace            = true
tracing.workspace               = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace    = true
utoipa.workspace                = true
uuid.workspace                  = true
url.workspace                   = true

[features]
# Tests against a live Keycloak; run by hand with `--features keycloak-tests`.
keycloak-tests = []
# The developer-only fleet console (V2-D472); refused in release builds.
fleet-console = ["dep:attome-fleet"]

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
# Y5-T3: the service's Job Object memory limit.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[test]]
name = "keycloak_oidc"
required-features = ["keycloak-tests"]

[dev-dependencies]
attome-approval.workspace = true
attome-fleet.workspace    = true
attome-testkit            = { workspace = true, features = ["app-config"] }
base64.workspace          = true
jsonwebtoken.workspace    = true
rsa.workspace             = true
totp-rs.workspace         = true
tower.workspace           = true

[lints]
workspace = true
