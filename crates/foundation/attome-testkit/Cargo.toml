[package]
name         = "attome-testkit"
description  = "Shared support for Attome's database-backed tests: one throwaway database per test process."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish.workspace      = true

[dependencies]
attome-config   = { workspace = true, optional = true }
attome-jobs     = { workspace = true, optional = true }
attome-types    = { workspace = true, optional = true }
base64          = { workspace = true, optional = true }
chrono          = { workspace = true, optional = true }
ed25519-dalek   = { workspace = true, optional = true }
serde           = { workspace = true, optional = true }
serde_json      = { workspace = true, optional = true }
sha2            = { workspace = true, optional = true }
sqlx.workspace  = true
tokio.workspace = true
tracing            = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url.workspace   = true
uuid.workspace  = true

[features]
# Z2-T10: `query_counter`, the per-task SQL statement count behind the query
# budget tests.
query-counter = ["dep:tracing", "dep:tracing-subscriber"]
# `point_config_at`, for tests that build an `AppConfig`; optional so the
# crates below attome-config can use this crate without a cycle.
app-config = ["dep:attome-config"]
# Z7-T7: `jobs`, run a registered job at once and move schedule time.
jobs = ["dep:attome-jobs", "dep:attome-types", "dep:chrono", "dep:serde"]
# S2-T10: `examples`, request/response examples captured from tests.
examples = ["dep:serde_json"]
# Q6-T1: `passkey`, a software authenticator for the passkey ceremonies.
passkey = ["dep:base64", "dep:ed25519-dalek", "dep:serde_json", "dep:sha2"]

[lints]
workspace = true
