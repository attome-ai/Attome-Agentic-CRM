[package]
name         = "attome-cache"
description  = "Attome's shared-state infrastructure: local snapshot and hot caches, Redis connectivity and cross-node coordination."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish.workspace      = true

[dependencies]
arc-swap.workspace      = true
attome-config.workspace = true
attome-types.workspace  = true
chrono.workspace        = true
fred.workspace          = true
metrics.workspace       = true
moka.workspace          = true
serde.workspace         = true
serde_json.workspace    = true
thiserror.workspace     = true
tokio.workspace         = true
tracing.workspace       = true
uuid.workspace          = true

[dev-dependencies]
attome-testkit.workspace = true

[features]
# AA14-T3: fred opens a `fred.command` tracing span for every Redis command,
# which `attome_testkit::query_counter` counts per request. Test builds only:
# the shipped binary is built without dev-dependencies, so never with this.
count-redis = ["fred/partial-tracing"]

[lints]
workspace = true
