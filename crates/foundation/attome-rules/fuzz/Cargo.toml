[package]
name = "attome-rules-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Z11-T17: fuzz targets for the rule language, the expression text a builder
# (or an agent) writes: the V2 parser (fuzz_parse_v2) and compile-then-eval
# (fuzz_eval_v2).
#
# Not a workspace member, like attome-auth's fuzz crate: cargo-fuzz needs a
# nightly toolchain and libFuzzer, and the repository builds on stable. Run on
# Linux or WSL:
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run fuzz_parse_v2 -- -max_total_time=60
#   cargo +nightly fuzz run fuzz_eval_v2 -- -max_total_time=60

[package.metadata]
cargo-fuzz = true

# Its own workspace root, so the repository's `cargo build --workspace` never
# resolves it.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
chrono = "0.4"

[dependencies.attome-rules]
path = ".."

[[bin]]
name = "fuzz_parse_v2"
path = "fuzz_targets/fuzz_parse_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_eval_v2"
path = "fuzz_targets/fuzz_eval_v2.rs"
test = false
doc = false
bench = false
