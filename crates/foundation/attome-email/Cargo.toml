[package]
name         = "attome-email"
description  = "Attome's outbound email: SMTP sending with failure classification, the delivery ledger and the suppression list."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish.workspace      = true

[dependencies]
attome-config.workspace = true
attome-db.workspace     = true
attome-html.workspace   = true
attome-outbound.workspace = true
attome-rules.workspace  = true
attome-types.workspace  = true
base64.workspace        = true
chrono.workspace        = true
hex.workspace           = true
hmac.workspace          = true
lettre.workspace        = true
metrics.workspace       = true
reqwest.workspace       = true
serde.workspace         = true
serde_json.workspace    = true
sha2.workspace          = true
sqlx.workspace          = true
tokio.workspace         = true
tracing.workspace       = true
uuid.workspace          = true

[features]
# `attome_email::testing::FakeInbox`, the in-process SMTP inbox tests send to.
test-support = []

[dev-dependencies]
attome-email   = { path = ".", features = ["test-support"] }
attome-testkit.workspace = true

[lints]
workspace = true
