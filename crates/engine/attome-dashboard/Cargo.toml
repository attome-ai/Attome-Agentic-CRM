axum.workspace            = true
chrono.workspace          = true
chrono-tz.workspace       = true
futures-util.workspace    = true
serde.workspace           = true
serde_json.workspace      = true
sha2.workspace            = true
sqlx.workspace            = true
tracing.workspace         = true
utoipa.workspace          = true
uuid.workspace            = true

[dev-dependencies]
attome-cache.workspace    = true
