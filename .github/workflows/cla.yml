# AF1-T2: every pull request's author accepts CLA.md before it can merge.
#
# CLA Assistant Lite comments on a pull request whose author has not
# accepted the agreement; the author replies with the sentence it asks for,
# and the acceptance is stored in signatures/cla.json on the
# `cla-signatures` branch, so it covers every later pull request. The job
# never checks out or runs the pull request's code, which is what makes
# `pull_request_target` (needed to comment on pull requests from forks)
# safe here. Maintainers and bots in the allow-list are exempt.

name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: attome-ai,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, please read the
            [Attome Contributor Licence Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and accept it by commenting with the sentence below. You keep the copyright in your work.
          custom-allsigned-prcomment: All contributors have accepted the CLA. Thank you.
