name: release-check

# The release gate (`attome release --check`: format, clippy with warnings as
# errors, tests and the rest) on Linux and Windows, on every push and pull
# request. The gate's `tests` step is split out (`--skip tests`): four Linux
# shards run the workspace's tests with cargo-nextest, each against its own
# PostgreSQL, Redis and object store, so a run takes about an hour instead of
# the four the single job took. Windows has no database, so its database
# tests print SKIP. `attome release --check` with no `--skip` stays the full
# gate a release is cut from.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A running check is never cancelled, so every check that starts reports in
# full; pushes made while one runs wait, and only the newest of them is kept
# (GitHub replaces an older pending run in the group with a newer one).
concurrency:
  # v5 (2026-10-29): a new group each time the gate fixes or the CI split had
  # to start without waiting on an hours-long run of the code before them.
  group: release-check-v5-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Test threads get the 64 MiB stack serve.rs gives boot: tests that drive
  # attome::boot::init overflowed 32 MiB in an unoptimized build.
  RUST_MIN_STACK: "67108864"
  # No debug info in CI: the line tables Cargo.toml keeps for local backtraces
  # made the test binaries outgrow the Linux runner's disk and the Windows
  # job's time limit. Panic messages still name the failing test.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux:
    name: release check (linux, gate steps)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0-beta.12
        env:
          RUSTFS_ACCESS_KEY: attometest
          RUSTFS_SECRET_KEY: attometest-secret
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ATTOME_TEST_REQUIRE_DB: "1"
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: "6379"
      REDIS_URL: redis://127.0.0.1:6379/0
      ATTOME_TEST_REQUIRE_REDIS: "1"
      S3_ACCESS_KEY: attometest
      S3_SECRET_KEY: attometest-secret
      TEST_S3_ACCESS_KEY: attometest
      TEST_S3_SECRET_KEY: attometest-secret
      ATTOME_TEST_REQUIRE_S3: "1"
      # AF4: the gate times `attome init` into this empty database.
      ATTOME_INSTALL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/attome_install
    steps:
      # The gate's test binaries outgrow the runner's free disk ("No space left
      # on device"); the preinstalled SDKs this job never uses free ~25 GB.
      - name: free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml (with clippy and
      # rustfmt), caches the cargo registry and target directory, and turns
      # compiler and clippy messages into annotations on the run.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # The object-store tests expect the `attomebase` and `attome-test` buckets.
      - name: create the object-store test bucket
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: attometest
          AWS_SECRET_ACCESS_KEY: attometest-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            aws --endpoint-url http://127.0.0.1:9000 s3 ls && break
            sleep 2
          done
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://attomebase
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://attome-test
      - name: create the install-timing database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE attome_install'
      - name: install promtool
        shell: bash
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz | tar -xz
          echo "ATTOME_PROMTOOL=$PWD/prometheus-3.5.0.linux-amd64/promtool" >> "$GITHUB_ENV"
      - name: attome release --check --skip tests
        shell: bash
        run: |
          set -o pipefail
          cargo run -p attome-release --target-dir target/gate -- --check --skip tests 2>&1 | tee release-check.log
      # cargo-nextest (the shards below) does not run doctests; the gate's
      # `cargo test --workspace` did, so they run here.
      - name: doctests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --doc --no-fail-fast 2>&1 | tee -a release-check.log
      # GitHub shows at most 10 error annotations per step, so the full list of
      # failures goes into one annotation: errors, their locations, and failed
      # tests, readable through the public checks API.
      - name: summarize failures
        if: failure()
        shell: bash
        run: bash scripts/ci/summarize-failures.sh release-check.log
      # The gate report and the full log stay with the run as evidence (AC4).
      - name: keep the gate report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-linux
          path: |
            target/release-gate/*.json
            release-check.log
          if-no-files-found: ignore
          retention-days: 30

  tests:
    name: tests (linux, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0-beta.12
        env:
          RUSTFS_ACCESS_KEY: attometest
          RUSTFS_SECRET_KEY: attometest-secret
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ATTOME_TEST_REQUIRE_DB: "1"
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: "6379"
      REDIS_URL: redis://127.0.0.1:6379/0
      ATTOME_TEST_REQUIRE_REDIS: "1"
      S3_ACCESS_KEY: attometest
      S3_SECRET_KEY: attometest-secret
      TEST_S3_ACCESS_KEY: attometest
      TEST_S3_SECRET_KEY: attometest-secret
      ATTOME_TEST_REQUIRE_S3: "1"
    steps:
      # The gate's test binaries outgrow the runner's free disk ("No space left
      # on device"); the preinstalled SDKs this job never uses free ~25 GB.
      - name: free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The object-store tests expect the `attomebase` and `attome-test` buckets.
      - name: create the object-store test bucket
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: attometest
          AWS_SECRET_ACCESS_KEY: attometest-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            aws --endpoint-url http://127.0.0.1:9000 s3 ls && break
            sleep 2
          done
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://attomebase
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://attome-test
      # One test at a time, as the gate's `--test-threads=1` ran them: the
      # database suites share one PostgreSQL and its metadata locks. Each shard
      # is a stable quarter of the tests by name hash.
      - name: tests (shard ${{ matrix.shard }} of 4)
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-fail-fast --test-threads 1 \
            --partition hash:${{ matrix.shard }}/4 2>&1 | tee tests.log
      - name: summarize failures
        if: failure()
        shell: bash
        run: bash scripts/ci/summarize-failures.sh tests.log
      - name: keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-linux-${{ matrix.shard }}
          path: tests.log
          if-no-files-found: ignore
          retention-days: 30

  windows:
    name: release check (windows)
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-nextest
      - name: install promtool
        shell: bash
        run: |
          curl -sSL -o prometheus.zip https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.windows-amd64.zip
          unzip -q prometheus.zip 'prometheus-3.5.0.windows-amd64/promtool.exe'
          echo "ATTOME_PROMTOOL=$(cygpath -w "$PWD/prometheus-3.5.0.windows-amd64/promtool.exe")" >> "$GITHUB_ENV"
      - name: attome release --check --skip tests
        shell: bash
        run: |
          set -o pipefail
          cargo run -p attome-release --target-dir target/gate -- --check --skip tests 2>&1 | tee release-check.log
      # No database here: the database suites print SKIP, and everything else
      # runs in parallel (.config/nextest.toml caps the threads for Windows).
      - name: tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-fail-fast 2>&1 | tee -a release-check.log
      - name: summarize failures
        if: failure()
        shell: bash
        run: bash scripts/ci/summarize-failures.sh release-check.log
      # The gate report and the full log stay with the run as evidence (AC4).
      - name: keep the gate report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-windows
          path: |
            target/release-gate/*.json
            release-check.log
          if-no-files-found: ignore
          retention-days: 30
