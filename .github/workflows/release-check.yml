name: release-check

# The one release gate (`attome release --check`: format, clippy with warnings
# as errors, tests) on Linux and Windows, on every push and pull request.
# Linux runs the database- and Redis-backed tests against PostgreSQL and Redis
# services; Windows has neither, so those tests print SKIP there.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "33554432"

jobs:
  linux:
    name: release check (linux, with postgres and redis)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.0-beta.12
        env:
          RUSTFS_ACCESS_KEY: attometest
          RUSTFS_SECRET_KEY: attometest-secret
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ATTOME_TEST_REQUIRE_DB: "1"
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: "6379"
      REDIS_URL: redis://127.0.0.1:6379/0
      ATTOME_TEST_REQUIRE_REDIS: "1"
      S3_ACCESS_KEY: attometest
      S3_SECRET_KEY: attometest-secret
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml (with clippy and
      # rustfmt), caches the cargo registry and target directory, and turns
      # compiler and clippy messages into annotations on the run.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The object-store tests expect the `attomebase` bucket to exist.
      - name: create the object-store test bucket
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: attometest
          AWS_SECRET_ACCESS_KEY: attometest-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://attomebase && break
            sleep 2
          done
      - name: attome release --check
        shell: bash
        run: |
          set -o pipefail
          cargo run -p attome-release -- --check 2>&1 | tee release-check.log
      # GitHub shows at most 10 error annotations per step, so the full list of
      # failures goes into one annotation: errors, their locations, and failed
      # tests, readable through the public checks API.
      - name: summarize failures
        if: failure()
        shell: bash
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' release-check.log | grep -E '^(error|warning)(\[|:)|^ *--> |^---- .* stdout ----|panicked at|^test .* FAILED|^Diff in' | head -400 > failures.txt || true
          body=$(sed -e 's/%/%25/g' failures.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=release check failures::${body}"

  windows:
    name: release check (windows)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: attome release --check
        shell: bash
        run: |
          set -o pipefail
          cargo run -p attome-release -- --check 2>&1 | tee release-check.log
      # GitHub shows at most 10 error annotations per step, so the full list of
      # failures goes into one annotation: errors, their locations, and failed
      # tests, readable through the public checks API.
      - name: summarize failures
        if: failure()
        shell: bash
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' release-check.log | grep -E '^(error|warning)(\[|:)|^ *--> |^---- .* stdout ----|panicked at|^test .* FAILED|^Diff in' | head -400 > failures.txt || true
          body=$(sed -e 's/%/%25/g' failures.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=release check failures::${body}"
