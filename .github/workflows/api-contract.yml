name: api-contract

# Regenerates the API contract from the Rust handlers' `#[utoipa::path]`
# annotations (`npm run generate:api`: `attome serve --print-openapi`, then
# openapi-typescript) and commits `openapi.json` and both `api-types.ts` back
# to main when they changed, so the committed contract never lags the code.
# A push made with GITHUB_TOKEN starts no other workflow, so this cannot loop;
# the next ordinary push runs the gate over the regenerated files.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/scripts/generate-api-types.mjs"
      - ".github/workflows/api-contract.yml"
  workflow_dispatch:

permissions:
  contents: write
  # A push made with GITHUB_TOKEN starts no workflow, so the regenerated
  # types would never reach web-check; dispatching it explicitly does.
  actions: write

concurrency:
  group: api-contract
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web dependencies
        working-directory: web
        run: npm ci
      - name: generate
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run generate:api 2>&1 | tee ../api-contract.log
      # This builds the server first, so it reports compile errors well before
      # the release gate does; the same summary step makes them readable.
      - name: summarize failures
        if: failure()
        shell: bash
        run: bash scripts/ci/summarize-failures.sh api-contract.log
      - name: commit when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- openapi.json openapi.ar.json web/projects/base/src/lib/generated web/projects/sdk/src/lib/generated; then
            echo "the API contract is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json openapi.ar.json web/projects/base/src/lib/generated web/projects/sdk/src/lib/generated
          git commit -m "chore(api): regenerate openapi.json and api-types"
          # npm ci and the build can touch tracked files the contract does not
          # own; set them aside so the rebase onto a newer main can run.
          git status --short
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              gh workflow run web-check.yml --ref main
              exit 0
            fi
            sleep 10
          done
          exit 1
