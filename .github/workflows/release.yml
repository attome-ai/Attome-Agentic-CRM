name: release

# Builds the downloads the one-command install fetches (scripts/install.sh,
# scripts/install.ps1) when a version tag is pushed (`attome release tag`
# makes one once both OS gate reports are green): one archive per OS holding
# the `attome` binary and the built web app in `web/`, which `attome serve`
# serves itself. Attached to the GitHub release of that tag with a SHA-256
# file per archive.
#
# U1-T2: the same files also as a Windows installer (packaging/windows,
# WiX; signed with Authenticode when the AUTHENTICODE_PFX secret is set,
# AC7) with its winget manifests (packaging/winget), and as .deb and .rpm
# packages for Linux (packaging/linux, nfpm).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: web app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist/attome-website/browser
          if-no-files-found: error

  binary:
    name: attome (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            exe: attome
          - os: windows
            runner: windows-latest
            exe: attome.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release -p attome --bin attome
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: package/web
      - name: package (Linux)
        if: matrix.os == 'linux'
        run: |
          cp target/release/attome package/
          cp LICENSE NOTICE README.md config.example.json package/
          cp -r packs package/packs
          tar -czf attome-linux-x86_64.tar.gz -C package .
          sha256sum attome-linux-x86_64.tar.gz > attome-linux-x86_64.tar.gz.sha256
      - name: deb and rpm (Linux)
        if: matrix.os == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) VERSION=0.0.0 ;; esac
          export VERSION
          "$(go env GOPATH)/bin/nfpm" package --config packaging/linux/nfpm.yaml --packager deb --target attome-linux-amd64.deb
          "$(go env GOPATH)/bin/nfpm" package --config packaging/linux/nfpm.yaml --packager rpm --target attome-linux-x86_64.rpm
          sha256sum attome-linux-amd64.deb > attome-linux-amd64.deb.sha256
          sha256sum attome-linux-x86_64.rpm > attome-linux-x86_64.rpm.sha256
      - name: package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Copy-Item target/release/attome.exe package/
          Copy-Item LICENSE, NOTICE, README.md, config.example.json package/
          Copy-Item -Recurse packs package/packs
          Compress-Archive -Path package/* -DestinationPath attome-windows-x86_64.zip
          $hash = (Get-FileHash attome-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  attome-windows-x86_64.zip" | Out-File -Encoding ascii attome-windows-x86_64.zip.sha256
      - name: installer and winget manifests (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          AUTHENTICODE_PFX: ${{ secrets.AUTHENTICODE_PFX }}
          AUTHENTICODE_PASSWORD: ${{ secrets.AUTHENTICODE_PASSWORD }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = '0.0.0' }
          wix build packaging/windows/attome.wxs -arch x64 -d Version=$version -d SourceDir=package -o attome-windows-x86_64.msi
          if ($env:AUTHENTICODE_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'authenticode.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:AUTHENTICODE_PFX))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:AUTHENTICODE_PASSWORD attome-windows-x86_64.msi
            if ($LASTEXITCODE -ne 0) { throw 'signing the MSI failed' }
            Remove-Item $pfx
          } else {
            Write-Host '::warning::AUTHENTICODE_PFX is not set: the MSI is not signed (AC7-T5).'
          }
          $msiHash = (Get-FileHash attome-windows-x86_64.msi -Algorithm SHA256).Hash.ToLower()
          "$msiHash  attome-windows-x86_64.msi" | Out-File -Encoding ascii attome-windows-x86_64.msi.sha256
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/attome-windows-x86_64.msi"
          node packaging/winget/generate.mjs $version $url $msiHash winget
          Compress-Archive -Path winget/* -DestinationPath attome-winget-manifests.zip
      - uses: actions/upload-artifact@v4
        with:
          name: attome-${{ matrix.os }}
          path: |
            attome-${{ matrix.os }}-x86_64.*
            attome-${{ matrix.os }}-amd64.*
            attome-winget-manifests.zip

  publish:
    name: publish the release
    needs: binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # deploy/cosign.pub, to verify each signature.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: attome-*
          merge-multiple: true
      # AC7-T5: every published file signed with the release key (D-673) and
      # verified against deploy/cosign.pub, offline (no transparency log).
      # COSIGN_KEY_PEM holds the encrypted private key, COSIGN_PASSWORD its
      # password; without them the release is published unsigned, with a warning.
      - name: sign with cosign
        env:
          COSIGN_KEY_PEM: ${{ secrets.COSIGN_KEY_PEM }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_KEY_PEM" ] || [ ! -f deploy/cosign.pub ]; then
            echo '::warning::COSIGN_KEY_PEM or deploy/cosign.pub is missing: the release files are not cosign-signed (AC7-T5).'
            exit 0
          fi
          curl -sSfL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          key="$RUNNER_TEMP/cosign.key"
          printf '%s' "$COSIGN_KEY_PEM" > "$key"
          for f in attome-*.tar.gz attome-*.zip attome-*.msi attome-*.deb attome-*.rpm; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --tlog-upload=false --key "$key" --output-signature "$f.sig" "$f"
            cosign verify-blob --insecure-ignore-tlog=true --key deploy/cosign.pub --signature "$f.sig" "$f"
          done
          rm -f "$key"
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            attome-*.sig
            attome-linux-x86_64.tar.gz
            attome-linux-x86_64.tar.gz.sha256
            attome-windows-x86_64.zip
            attome-windows-x86_64.zip.sha256
            attome-windows-x86_64.msi
            attome-windows-x86_64.msi.sha256
            attome-winget-manifests.zip
            attome-linux-amd64.deb
            attome-linux-amd64.deb.sha256
            attome-linux-x86_64.rpm
            attome-linux-x86_64.rpm.sha256
