# Each test is its own process with its own throwaway database. On Windows the
# thousands of short-lived connections can exhaust the ephemeral TCP port range
# (os error 10048), so parallelism is capped.
[profile.default]
test-threads = 6
slow-timeout = { period = "60s", terminate-after = 3 }

# Tests that run the migrations or a full boot on their own database
# (rather than copying attome-testkit's template) race on the cluster-wide
# roles migration 0009 creates ("tuple concurrently updated") when two run at
# once, so they run one at a time, alongside everything else.
[test-groups]
own-migrations = { max-threads = 1 }
profiler-redis = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
binary(changeset_platform_boot) | binary(concurrent_boot) | binary(fresh_bootstrap)
| binary(solo_memory_boot) | binary(changeset_replay) | binary(provision)
| binary(cross_deployment_isolation) | binary(migration_lock_timeout)
| binary(migration_migrator_lock)
| (package(attome) & kind(lib) & test(/^(boot|cmd::changeset_replay)::/))
| (package(attome-api) & kind(lib) & test(/^calendar_admin::/))
| (package(attome-db) & kind(lib) & test(/^migrate::/))
'''
test-group = 'own-migrations'

# The profiler's probe keys are one Redis keyspace every test process shares:
# a test that seeds a measurement and one that expects none, run at once,
# see each other's keys. Its tests run one at a time.
[[profile.default.overrides]]
filter = 'package(attome-api) & binary(profiler_admin)'
test-group = 'profiler-redis'

# attome-testapp tests install whole packs on their own database and take
# 60-180 s each on a CI runner; at the default 3 x 60 s the slowest were
# killed at random. They get five periods.
[[profile.default.overrides]]
filter = 'package(attome-testapp)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The migration-path test replays the whole migration set ~20 times on
# empty databases of its own (it also runs migration 0009's cluster-wide
# roles, so it joins own-migrations).
[[profile.default.overrides]]
filter = 'binary(migration_path_independence)'
test-group = 'own-migrations'
slow-timeout = { period = "60s", terminate-after = 10 }
