# M86 O3 — loads observability/dashboard.json unchanged. docker-compose.yml
# mounts that one file read-only at the path below.
apiVersion: 1

providers:
  - name: attome
    folder: Attome
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
